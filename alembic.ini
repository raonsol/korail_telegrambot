# 마이그레이션 CLI 설정 (앱은 시작 시 Database.migrate()로 자동 적용하므로 평소에는 필요 없음)
#   새 리비전: cd 저장소 루트 && DATABASE_URL=... pipenv run alembic revision --autogenerate -m "..."
#   상태 확인: pipenv run alembic current
# DB 주소는 DATABASE_URL 환경변수 (기본 sqlite:///./korail_bot.db) - src/core/migrations/env.py 참고

[alembic]
script_location = src/core/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
level = NOTSET
class = logging.StreamHandler
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
