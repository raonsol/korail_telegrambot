# Development override for docker-compose.yml
services:
  # Redis Dev - 별도 dev 인스턴스 (Celery 모드에서만 사용)
  redis:
    container_name: korail_dev_redis
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - redis_dev_data:/data
    networks:
      - korail_dev_network
    profiles:
      - celery  # Only start with Celery profile

  # PostgreSQL Dev - 별도 dev 인스턴스 (Celery 모드에서만 사용)
  postgres:
    container_name: korail_dev_postgres
    environment:
      POSTGRES_DB: korail_bot_dev
      POSTGRES_USER: korail_dev
      POSTGRES_PASSWORD: password_dev
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - korail_dev_network
    profiles:
      - celery  # Only start with Celery profile

  # FastAPI App - 개발 모드 (subprocess mode)
  web:
    container_name: korail_dev_web
    command: fastapi dev app.py --host 0.0.0.0 --port 8390
    ports:
      - "8390:8390"
    environment:
      - TZ=Asia/Seoul
      - USE_CELERY=false  # Subprocess mode
      - IS_DEV=true  # Enable dev mode for port configuration
    volumes:
      - ./src:/app  # Mount source code for hot reload
      - ./logs:/app/logs
    networks:
      - korail_dev_network
    profiles:
      - subprocess  # Only start with subprocess profile

  # FastAPI App - 개발 모드 (Celery mode)
  web_celery:
    container_name: korail_dev_web_celery
    command: fastapi dev app.py --host 0.0.0.0 --port 8390
    ports:
      - "8390:8390"
    environment:
      - TZ=Asia/Seoul
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - USE_CELERY=true  # Celery mode
      - IS_DEV=true  # Enable dev mode for port configuration
    depends_on:
      - redis
      - postgres
    volumes:
      - ./src:/app  # Mount source code for hot reload
      - ./logs:/app/logs
    networks:
      - korail_dev_network
    profiles:
      - celery  # Only start with Celery profile

  # Celery Worker - 개발 모드
  worker:
    container_name: korail_dev_worker
    environment:
      - TZ=Asia/Seoul
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://korail_dev:password_dev@postgres:5432/korail_bot_dev
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - USE_CELERY=true
      - CELERY_WORKER_NAME=worker
      - IS_DEV=true
    profiles:
      - celery  # Only start with Celery profile
    volumes:
      - ./src:/app  # Mount source code for live changes
      - ./logs:/app/logs
    networks:
      - korail_dev_network

  # Celery Beat - 개발 모드
  beat:
    container_name: korail_dev_beat
    environment:
      - TZ=Asia/Seoul
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://korail_dev:password_dev@postgres:5432/korail_bot_dev
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - USE_CELERY=true
      - CELERY_WORKER_NAME=beat
      - IS_DEV=true
    volumes:
      - ./src:/app  # Mount source code for live changes
    networks:
      - korail_dev_network
    profiles:
      - celery  # Only start with Celery profile

  # Flower - 개발 모드
  flower:
    container_name: korail_dev_flower
    ports:
      - "5556:5555"  # Different port to avoid conflicts with prod
    environment:
      - TZ=Asia/Seoul
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - USE_CELERY=true
      - CELERY_WORKER_NAME=flower
      - IS_DEV=true
    volumes:
      - ./src:/app  # Mount source code for live changes
    networks:
      - korail_dev_network
    profiles:
      - celery  # Only start with Celery profile

volumes:
  redis_dev_data:
  postgres_dev_data:

networks:
  korail_dev_network:
    driver: bridge
    name: korail_dev_network