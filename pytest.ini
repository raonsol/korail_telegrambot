[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
pythonpath = src

# Enable asyncio support
asyncio_mode = auto

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    subprocess: Tests for subprocess execution mode
    celery: Tests for Celery execution mode
    slow: Tests that take a long time to run
    requires_redis: Tests that require Redis to be running
    requires_external: Tests that require external services (Telegram, Korail)

# Ignore patterns
norecursedirs = .git .tox dist build *.egg logs
