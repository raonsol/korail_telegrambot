name: Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  PIPENV_NOSPIN: "1"

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Run black
      uses: psf/black@stable
      with:
        version: "25.9.0"
        options: "--check --diff ."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: Pipfile.lock

    - name: Install dependencies
      run: |
        python -m pip install pipenv
        pipenv sync --dev --system

    - name: Run unit tests
      env:
        IS_DEV: true
        BOTTOKEN_DEV: test_bot_token_dev
        BOTTOKEN: test_bot_token_prod
        WEBHOOK_URL_DEV: http://test-dev.example.com
        WEBHOOK_URL: http://test-prod.example.com
        ALLOW_LIST: 01012345678,01087654321
        ADMINPW: test_admin_password
        ADMIN_KORAIL_ID: admin_user
        ADMIN_KORAIL_PW: admin_pass
      run: |
        COVERAGE_FILE=.coverage.unit pytest -m unit -v --cov=src --cov-report=term-missing

    - name: Upload unit coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data-unit
        path: .coverage.unit
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14

  integration-tests-subprocess:
    name: Integration Tests (Subprocess Mode)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: Pipfile.lock

    - name: Install dependencies
      run: |
        python -m pip install pipenv
        pipenv sync --dev --system

    - name: Run subprocess mode tests
      env:
        IS_DEV: true
        BOTTOKEN_DEV: test_bot_token_dev
        WEBHOOK_URL_DEV: http://test-dev.example.com
        ALLOW_LIST: 01012345678
        ADMINPW: test_admin_password
        USE_CELERY: false
      run: |
        COVERAGE_FILE=.coverage.subprocess pytest -m subprocess -v --cov=src --cov-report=term-missing

    - name: Upload subprocess coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data-subprocess
        path: .coverage.subprocess
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14

  integration-tests-mq:
    name: Integration Tests (MQ)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: Pipfile.lock

    - name: Install dependencies
      run: |
        python -m pip install pipenv
        pipenv sync --dev --system

    - name: Run MQ integration tests
      env:
        IS_DEV: true
        BOTTOKEN_DEV: test_bot_token_dev
        WEBHOOK_URL_DEV: http://test-dev.example.com
        ALLOW_LIST: 01012345678
        ADMINPW: test_admin_password
        ADMIN_KORAIL_ID: admin_user
        ADMIN_KORAIL_PW: admin_pass
        USE_CELERY: true
        REDIS_URL: redis://localhost:6379
        CELERY_BROKER: redis://localhost:6379
        CELERY_RESULT_BACKEND: redis://localhost:6379
      run: |
        COVERAGE_FILE=.coverage.mq pytest -m "celery or requires_redis" -v --cov=src --cov-report=term-missing

    - name: Upload MQ integration coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data-mq
        path: .coverage.mq
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: Pipfile.lock

    - name: Install dependencies
      run: |
        python -m pip install pipenv
        pipenv sync --dev --system

    - name: Run E2E tests
      env:
        IS_DEV: true
        BOTTOKEN_DEV: test_bot_token_dev
        WEBHOOK_URL_DEV: http://test-dev.example.com
        ALLOW_LIST: 01012345678
        ADMINPW: test_admin_password
      run: |
        COVERAGE_FILE=.coverage.e2e pytest -m e2e -v --cov=src --cov-report=term-missing

    - name: Upload e2e coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data-e2e
        path: .coverage.e2e
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14

  coverage-report:
    name: Coverage Report (All Tests)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests-subprocess, integration-tests-mq, e2e-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: Pipfile.lock

    - name: Install coverage tool
      run: |
        python -m pip install coverage

    - name: Download coverage data artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-data-*
        path: coverage-data
        merge-multiple: true

    - name: Combine and generate coverage reports
      run: |
        ls -al coverage-data
        coverage combine coverage-data
        coverage xml -o coverage.xml
        coverage html -d htmlcov
        coverage report -m

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: alltests
        name: all-tests-coverage
        fail_ci_if_error: false

    - name: Upload HTML coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-tests-coverage-html
        path: htmlcov/
        retention-days: 14

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t korail-bot:test .

    - name: Test Docker image
      run: |
        docker images | grep korail-bot
