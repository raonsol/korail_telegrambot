services:
  # Cloudflare WARP - 코레일 API 요청을 WARP 로 우회하는 프록시 (HTTP/SOCKS5, warp:1080)
  # 오픈 프록시가 되지 않도록 호스트에 포트를 노출하지 않고 내부 네트워크에서만 사용
  # USE_WARP=false 이면 make docker-compose-up(-mq) 가 docker-compose.nowarp.yml 을 덧붙여 제외함
  warp:
    image: caomingjun/warp
    restart: always
    # runc 1.2 이후 기본 device 규칙에서 빠진 tun 장치 접근 허용
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - TZ=Asia/Seoul
      - WARP_SLEEP=2
      - WARP_LICENSE_KEY=${WARP_LICENSE_KEY:-}  # WARP+ 라이선스 (선택)
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    networks:
      - korail_network
    profiles:
      - subprocess
      - celery

  # Redis - 상태 관리 및 메시지 브로커 (Celery 모드에서만 사용)
  # 컨테이너끼리만 사용하므로 호스트 포트를 열지 않음
  # (로컬 make run-mq/dev-mq 의 Redis(6379)와 충돌 방지, 인증 없는 Redis 외부 노출 방지)
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - TZ=Asia/Seoul
    volumes:
      - redis_data:/data
    networks:
      - korail_network
    profiles:
      - celery  # Only start with Celery profile

  # PostgreSQL - 영구 데이터 저장 (Celery 모드에서만 사용)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: korail_bot
      POSTGRES_USER: korail
      POSTGRES_PASSWORD: password
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - korail_network
    profiles:
      - celery  # Only start with Celery profile

  # FastAPI App - 메인 웹서버 (subprocess mode)
  web:
    build: .
    ports:
      - "8391:8391"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - USE_CELERY=false
      - WARP_PROXY_URL=socks5h://warp:1080
      - USE_WARP=${USE_WARP:-true}
    depends_on:
      warp:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - korail_network
    profiles:
      - subprocess

  # FastAPI App - Celery mode
  web_celery:
    build: .
    ports:
      - "8391:8391"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - USE_CELERY=true
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - WARP_PROXY_URL=socks5h://warp:1080
      - USE_WARP=${USE_WARP:-true}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
      warp:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - korail_network
    profiles:
      - celery

  # Celery Worker - 예약 처리
  worker:
    build: .
    command: celery -A telegramBot.tasks worker --loglevel=info
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://korail:password@postgres:5432/korail_bot
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - USE_CELERY=true
      - CELERY_WORKER_NAME=worker
      - WARP_PROXY_URL=socks5h://warp:1080
      - USE_WARP=${USE_WARP:-true}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
      warp:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - korail_network
    profiles:
      - celery  # Only start with Celery profile

  # Celery Beat - 스케줄링 (필요시)
  beat:
    build: .
    command: celery -A telegramBot.tasks beat --loglevel=info
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://korail:password@postgres:5432/korail_bot
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - USE_CELERY=true
      - CELERY_WORKER_NAME=beat
    depends_on:
      - redis
      - postgres
    networks:
      - korail_network
    profiles:
      - celery  # Only start with Celery profile

  # Flower - Celery 모니터링
  flower:
    build: .
    command: celery -A telegramBot.tasks flower
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - CELERY_BROKER=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - USE_CELERY=true
      - CELERY_WORKER_NAME=flower
    depends_on:
      - redis
    networks:
      - korail_network
    profiles:
      - celery  # Only start with Celery profile

volumes:
  redis_data:
  postgres_data:
  warp_data:

networks:
  korail_network:
    driver: bridge
    name: korail_prod_network
